topics:
  image: /camera/camera/color/image_raw
  camera_info: /camera/camera/color/camera_info
  lidar: /livox/lidar

synchronization:
  max_delta_ms: 50.0

calibration:
  # The sensor mount must remain rigid after this calibration is produced.
  result: outputs/calibration_reflectivity_result.json
  intrinsic_abs_tolerance: 0.001

preprocessing:
  # Livox frame used by the supplied bags: x forward, y left, z up.
  roi_m:
    x: [0.5, 50.0]
    y: [-15.0, 15.0]
    z: [-3.0, 5.0]
  ground_ransac:
    distance_threshold_m: 0.08
    iterations: 300
    min_up_normal_z: 0.80
    max_candidate_height_m: 0.50
  statistical_outlier:
    neighbors: 20
    std_ratio: 2.0
  dbscan:
    eps_m: 0.65
    min_samples: 8
  vehicle_filter:
    # Broad proposals only; these are not semantic vehicle detections.
    length_m: [1.5, 8.0]
    width_m: [0.8, 3.5]
    height_m: [0.8, 4.0]
    min_points: 20

conversion:
  # Generic XYZI and nuScenes-style CenterPoint/BEVFusion files are both saved.
  intensity_scale: 255.0

models:
  centerpoint:
    backend: mmdetection3d
    config: ""
    checkpoint: ""
  bevfusion:
    backend: mmdetection3d
    config: ""
    checkpoint: ""
  fine_tuned:
    checkpoint: ""
    annotations: ""
